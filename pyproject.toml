[tool.poetry]
name = "fil2md"
version = "0.1.1"
description = "A web-based file converter that transforms various file formats into Markdown"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
flask = "^3.1.3"
markitdown = {version = "^0.1.4", extras = ["all"]}
werkzeug = "^3.1.6"
openpyxl = "^3.1.5"
python-pptx = "^1.0.2"
pillow = "^13.0.0"
beautifulsoup4 = "^4.14.3"
lxml = "^6.1.0"
markdown = "^3.10"
python-docx = "^1.2.0"
# Security floor: remove the compromised emSign CA from the TLS trust bundle.
certifi = ">=2026.10.19"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
